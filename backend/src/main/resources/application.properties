spring.application.name=CatalogoDeProductos_TPI

# --- MySQL Connection (TPI Catalogo) ---
# 1. La URL de conexión. Apunta a la BD que acabas de crear.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/catalogo_productos_tpi

# 2. Tu usuario y clave de MySQL (de tu screenshot)
spring.datasource.username=grupo2
spring.datasource.password=grupo2

# --- JPA / Hibernate Configuration ---
# 3. Le dice a Hibernate que cree/actualice las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update

# 4. (Opcional) Muestra el SQL en la consola. Muy útil para debuggear.
spring.jpa.show-sql=true

# 5. (Opcional) Formatea el SQL en la consola para que sea legible.
spring.jpa.properties.hibernate.format_sql=true

# ===============================================
# === URLs DE APIs EXTERNAS (Módulos) ===
# ===============================================
api.usuarios.url=http://localhost:8081/auth/authorize
api.inventario.url=http://localhost:8082/stock/
api.resenas.url=http://localhost:8083/reviews/