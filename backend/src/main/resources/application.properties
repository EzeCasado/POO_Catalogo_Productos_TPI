spring.application.name=CatalogoDeProductos_TPI

# ==========================================
# 1. CONFIGURACION DEL SERVIDOR (Nuestro Modulo)
# ==========================================

server.port=8082

# ==========================================
# 2. BASE DE DATOS (MySQL en el Servidor)
# ==========================================
# Apuntamos a localhost porque MySQL corre en el mismo servidor Linux.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/catalogo_productos_tpi?createDatabaseIfNotExist=true&serverTimezone=UTC

# Credenciales
spring.datasource.username=grupo2
spring.datasource.password=grupo2

#Habilitar el HTTPS
server.ssl.enabled=true
server.ssl.key-store:/etc/letsencrypt/live/poo2025.unsada.edu.ar/keystore.p12
server.ssl.key-store-password=unsada
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=poo2025
# ==========================================
# 3. JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update

# Logs de SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# 4. INTEGRACION CON OTROS GRUPOS (APIs Externas)
# ==========================================

# Modulo 1 (Usuarios) - Grupo 6
api.usuarios.url=https://poo2025.unsada.edu.ar:3001/usuarios/validar

# Modulo 3 (Inventario) - Grupo 4
api.inventario.url=https://poo2025.unsada.edu.ar:8083/stock/

# Modulo 7 (Resenas) - Grupo 3
api.resenas.url=https://poo2025.unsada.edu.ar:8080/reviews/rating/