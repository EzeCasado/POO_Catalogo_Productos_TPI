spring.application.name=CatalogoDeProductos_TPI

# ==========================================
# 1. CONFIGURACIÓN DEL SERVIDOR (Nuestro Módulo)
# ==========================================
# Corremos en el 8082 para no chocar con Reseñas (8080) ni Pagos (8000)
server.port=8082

# ==========================================
# 2. BASE DE DATOS (MySQL en el Servidor)
# ==========================================
# Apuntamos a localhost porque MySQL corre en el mismo servidor Linux.
# Si la base 'catalogo_productos_tpi' no existe, intentará crearla.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/catalogo_productos_tpi?createDatabaseIfNotExist=true&serverTimezone=UTC

# Credenciales (Según nuestra deducción del patrón 'grupoX')
spring.datasource.username=grupo2
spring.datasource.password=grupo2

# ==========================================
# 3. JPA / HIBERNATE
# ==========================================
# 'update': Crea las tablas (productos, categorías) si no existen.
spring.jpa.hibernate.ddl-auto=update

# Logs de SQL (Opcional: Poner en 'false' para producción si querés limpiar la consola)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# 4. INTEGRACIÓN CON OTROS GRUPOS (APIs Externas)
# ==========================================

# Módulo 1 (Usuarios) - Grupo 6
# Puerto estimado: 8081 (No estaba en el Excel, asumimos este).
api.usuarios.url=https://poo2025.unsada.edu.ar:8081/usuarios/validar

# Módulo 3 (Inventario) - Grupo 4
# Puerto estimado: 8083 (No estaba en el Excel, asumimos este).
api.inventario.url=https://poo2025.unsada.edu.ar:8083/stock/

# Módulo 7 (Reseñas) - Grupo 3
# Puerto OFICIAL según Excel: 8080
# (Corregido de 8084 a 8080)
api.resenas.url=https://poo2025.unsada.edu.ar:8080/reviews/rating/